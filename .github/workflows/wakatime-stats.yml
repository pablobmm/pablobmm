name: WakaTime Stats

on:
  schedule:
    # Atualiza a cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: anuraghazra/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Não precisa criar, o GitHub fornece
          SHOW_OS: "true"
          SHOW_PROJECTS: "false"
          SHOW_EDITORS: "true"
          SHOW_TIMEZONE: "true"
          SHOW_LANGUAGE: "true"
          SHOW_LINES_OF_CODE: "true"
